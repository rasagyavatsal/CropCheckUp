# Deploy a production preview for pull requests that touch the landing site.
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install landing dependencies and build
        working-directory: landing
        run: npm ci --ignore-scripts && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: landing
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CROPCHECKUP }}
          projectId: cropcheckup
