name: Deploy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Deploy to Cloud Run on a push to main. The identity provider only accepts main.
      - if: github.event_name == 'push'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/893696572314/locations/global/workloadIdentityPools/github/providers/cropcheckup
          service_account: github-deploy@leafcheckup.iam.gserviceaccount.com
      - if: github.event_name == 'push'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: cropcheckup
          project_id: leafcheckup
          region: us-central1
          source: .
